<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="50%" stop-color="#dd2a7b"/>
      <stop offset="100%" stop-color="#8134af"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Title Pill -->
  <rect x="495" y="32" width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="512" cy="48" r="4" fill="#10b981"/>
  <text x="526" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPEN SOURCE v2.0</text>

  <!-- Brand Title -->
  <text x="600" y="135" text-anchor="middle" fill="url(#cyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="4">U A A F</text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="3">UNIVERSAL AUTONOMOUS AUTOMATION FRAMEWORK</text>

  <!-- Description -->
  <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Autonomous 5-Platform Video Distribution &amp; Real-Time Audience Engagement Engine</text>

  <!-- Platform Badges -->
  <g transform="translate(180, 255)">
    <!-- Instagram -->
    <rect x="0" y="0" width="150" height="44" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="12" y="14" width="16" height="16" rx="4" fill="url(#igGrad)"/>
    <text x="38" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Instagram Reels</text>

    <!-- TikTok -->
    <rect x="170" y="0" width="150" height="44" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
    <circle cx="188" cy="22" r="8" fill="#000" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="208" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">TikTok API</text>

    <!-- YouTube Shorts -->
    <rect x="340" y="0" width="160" height="44" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="352" y="14" width="18" height="15" rx="3" fill="#ef4444"/>
    <polygon points="359,18 365,21.5 359,25" fill="#ffffff"/>
    <text x="380" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">YouTube Shorts</text>

    <!-- Facebook Reels -->
    <rect x="520" y="0" width="160" height="44" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="532" y="14" width="16" height="16" rx="8" fill="#1877f2"/>
    <text x="558" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Facebook Reels</text>

    <!-- X / Twitter -->
    <rect x="700" y="0" width="140" height="44" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="712" y="14" width="16" height="16" rx="4" fill="#000000" stroke="#475569" stroke-width="1"/>
    <text x="738" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">X Broadcast</text>
  </g>

  <!-- Feature Highlights -->
  <g transform="translate(210, 335)">
    <text x="0" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Token Auto-Rotation</text>
    <text x="190" y="18" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔄 Chunked Resumable Uploads</text>
    <text x="430" y="18" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💬 Instant Comment-to-DM</text>
    <text x="660" y="18" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ 100% Self-Hosted</text>
  </g>
</svg>