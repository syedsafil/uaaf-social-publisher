<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="480" fill="#080c14" rx="16"/>
  <rect width="1100" height="480" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16"/>

  <!-- Column 1: Input & Media Layer -->
  <g transform="translate(40, 50)" filter="url(#shadow)">
    <rect width="220" height="380" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="6" rx="3" fill="url(#accentCyan)"/>
    <text x="20" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">01 / INPUT LAYER</text>
    <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Assets &amp; Metadata</text>

    <!-- Sub-boxes -->
    <rect x="16" y="90" width="188" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="115" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Video Master Files</text>
    <text x="28" y="135" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">9:16 Vertical HD / 4K</text>

    <rect x="16" y="165" width="188" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="190" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Metadata Payload</text>
    <text x="28" y="210" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Captions, Tags &amp; Triggers</text>

    <rect x="16" y="240" width="188" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="265" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Schedule Timers</text>
    <text x="28" y="285" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Local &amp; Cloud Queue</text>

    <rect x="16" y="315" width="188" height="45" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="28" y="342" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">→ JSON Task Queue</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 270 240 L 305 240" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="305,235 315,240 305,245" fill="#38bdf8"/>

  <!-- Column 2: Orchestration Engine -->
  <g transform="translate(315, 50)" filter="url(#shadow)">
    <rect width="250" height="380" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="6" rx="3" fill="url(#accentPurple)"/>
    <text x="20" y="38" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">02 / UAAF ENGINE</text>
    <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Core Autonomous Services</text>

    <rect x="16" y="90" width="218" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="115" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Local Scheduler Loop</text>
    <text x="28" y="135" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Time-Check &amp; Fault-Tolerant</text>

    <rect x="16" y="165" width="218" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="190" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">OAuth Token Lifecycle</text>
    <text x="28" y="210" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Auto-Refresh (Zero Drop)</text>

    <rect x="16" y="240" width="218" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="265" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Chunked Media Uploader</text>
    <text x="28" y="285" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">HTTP/1.1 Socket Resilience</text>

    <rect x="16" y="315" width="218" height="45" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="28" y="342" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">→ Multi-Thread Dispatch</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 575 240 L 610 240" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="610,235 620,240 610,245" fill="#c084fc"/>

  <!-- Column 3: 5 Platforms Layer -->
  <g transform="translate(620, 50)" filter="url(#shadow)">
    <rect width="200" height="380" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#ec4899"/>
    <text x="20" y="38" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">03 / PLATFORMS</text>
    <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Simultaneous Broadcast</text>

    <rect x="16" y="85" width="168" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="112" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📸 Instagram Reels</text>

    <rect x="16" y="140" width="168" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="167" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎵 TikTok API</text>

    <rect x="16" y="195" width="168" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="222" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">▶️ YouTube Shorts</text>

    <rect x="16" y="250" width="168" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="277" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📘 Facebook Reels</text>

    <rect x="16" y="305" width="168" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="332" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✖️ X (Twitter)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 830 240 L 865 240" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="865,235 875,240 865,245" fill="#f472b6"/>

  <!-- Column 4: Audience & DM Engine -->
  <g transform="translate(875, 50)" filter="url(#shadow)">
    <rect width="190" height="380" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="6" rx="3" fill="url(#accentEmerald)"/>
    <text x="18" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">04 / ENGAGE</text>
    <text x="18" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Instant Comment-to-DM</text>

    <rect x="14" y="90" width="162" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="115" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Listener Worker</text>
    <text x="24" y="135" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Webhooks &amp; Poller</text>

    <rect x="14" y="170" width="162" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="195" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Keyword Match</text>
    <text x="24" y="215" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Exact Prompt Linking</text>

    <rect x="14" y="250" width="162" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="275" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Anti-Ban Synth</text>
    <text x="24" y="295" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">4,800+ Unique DMs</text>

    <rect x="14" y="325" width="162" height="40" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="350" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ Instant Private DM</text>
  </g>
</svg>